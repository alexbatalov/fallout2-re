name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Cache cmake build
        uses: actions/cache@v6
        with:
          path: build
          key: windows-x86-cmake-v3

      - name: Configure
        run: |
          cmake \
            -B build \
            -G "Visual Studio 17 2022" \
            -A Win32 \
            # EOL

      - name: Build
        run: |
          cmake \
            --build build \
            --config RelWithDebInfo \
            # EOL

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: fallout2-re
          path: build/RelWithDebInfo/fallout2-re.exe
          retention-days: 7
